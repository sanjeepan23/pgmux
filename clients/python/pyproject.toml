[project]
name = "pgmux-client-compat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.2.10",
    "asyncpg==0.30.0",
    "SQLAlchemy==2.0.43",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
