name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/...
      - name: Short fuzz run
        run: |
          go test ./internal/protocol -run '^$' -fuzz '^FuzzReadMessage$' -fuzztime 20s
          go test ./internal/prepared -run '^$' -fuzz '^FuzzRename$' -fuzztime 20s
          go test ./internal/auth -run '^$' -fuzz '^FuzzScramServer$' -fuzztime 20s

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start Postgres ${{ matrix.postgres }}
        run: make compose-up
        env:
          PG_VERSION: ${{ matrix.postgres }}
      - run: make e2e
