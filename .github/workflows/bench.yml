name: bench

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Client counts to test
        default: "10 100 1000"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run a short benchmark
        env:
          CLIENTS: ${{ inputs.clients }}
          DURATION: "20"
          WARMUP: "5"
          RUNS: "1"
        run: bench/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
