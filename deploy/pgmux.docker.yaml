# pgmux config for the Docker Compose stack.
listen: 0.0.0.0:6432
admin_listen: 0.0.0.0:9930
dashboard_dir: /usr/share/pgmux/dashboard
pool_mode: transaction
shutdown_timeout: 10s
max_client_conn: 10000

server:
  host: postgres
  port: 5432
  sslmode: verify-full
  sslrootcert: certs/ca.crt
  connect_timeout: 5s

client_tls:
  cert_file: certs/server.crt
  key_file: certs/server.key
  required: false

auth:
  method: scram-sha-256
  userlist: userlist.txt
  auth_user: pgmux_auth
  auth_query: SELECT usename, passwd FROM public.pgmux_lookup($1)
  auth_dbname: postgres

pool:
  default_size: 20
  min_size: 0
  idle_timeout: 10m
  max_lifetime: 1h
  query_wait_timeout: 30s
  health_check_period: 30s
  reset_query: DISCARD ALL

databases:
  appdb:
    pool_size: 25
  sessiondb:
    dbname: appdb
    pool_mode: session
    pool_size: 20

users:
  app:
    max_connections: 5000
